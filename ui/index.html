<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discovery Lab</title>
<style>
:root{--bg:#eef1f4;--paper:#fbfcfd;--ink:#14212e;--mut:#556575;--line:#c5cdd6;--wall:#2b3a4a;--acc:#0a6e6e;--accbg:#d8efee;--warn:#9a5200;--warnbg:#fde9cf;--run:#5a3fc0;--runbg:#e6e0fa;--ok:#17703f;--bad:#a3262a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e151c;--paper:#16212b;--ink:#e6edf3;--mut:#9aabbb;--line:#2f3f4e;--wall:#6f8599;--acc:#4fd1c5;--accbg:#12373a;--warn:#f0b35e;--warnbg:#3d2c12;--run:#b5a3ff;--runbg:#2a2350;--ok:#6fd49a;--bad:#ff8a8d}}
:root[data-theme="dark"]{--bg:#0e151c;--paper:#16212b;--ink:#e6edf3;--mut:#9aabbb;--line:#2f3f4e;--wall:#6f8599;--acc:#4fd1c5;--accbg:#12373a;--warn:#f0b35e;--warnbg:#3d2c12;--run:#b5a3ff;--runbg:#2a2350;--ok:#6fd49a;--bad:#ff8a8d}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:2px solid var(--wall);background:var(--paper)}
header h1{font-size:17px;margin:0;flex:1}
.pill{font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid var(--line)}
.pill.on{color:var(--run);background:var(--runbg);border-color:var(--run)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 11px;font-size:13px}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.no{border-color:var(--bad);color:var(--bad)}
.banner{background:var(--warnbg);border-left:4px solid var(--warn);padding:8px 18px;font-size:13px}
main{flex:1;min-height:0;display:grid;grid-template-columns:260px 1fr 290px}
.col{min-height:0;overflow:auto;padding:14px;background:var(--paper)}
.col.l{border-right:2px solid var(--wall)}.col.r{border-left:2px solid var(--wall)}
.col h2{font-size:14px;margin:0 0 8px}
.center{display:flex;flex-direction:column;min-height:0}
.rooms{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);min-height:50px;align-items:center}
.room{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 10px;font-size:13.5px;display:flex;gap:6px;align-items:center}
.room:hover{background:var(--accbg)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.working{background:var(--run)}.dot.waiting{background:var(--warn)}
.stream{flex:1;overflow:auto;padding:14px}
.ev{margin:0 0 10px;font-size:14px;max-width:80ch}
.ev .who{font-weight:600}.ev time{color:var(--mut);font-size:12px;margin-left:6px}
.ev.tool{font:12.5px ui-monospace,Menlo,Consolas,monospace;color:var(--mut)}
.ev.handoff{border-left:3px solid var(--run);padding-left:10px}
.ev.approval{border-left:3px solid var(--warn);padding-left:10px}
.ev.error{color:var(--bad)}.ev.you{background:var(--accbg);padding:6px 10px;border-radius:8px}
.ev.say{white-space:pre-wrap}
.empty{color:var(--mut);padding:18px 4px;max-width:60ch}
.ex{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
form.cmd{display:flex;gap:8px;padding:10px 14px;border-top:2px solid var(--wall);background:var(--paper)}
form.cmd textarea{flex:1;resize:none;height:44px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.drop{border:2px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--mut);font-size:13px;margin-bottom:12px}
.drop.over{border-color:var(--acc);background:var(--accbg)}
.file{display:block;width:100%;text-align:left;border:0;background:none;padding:3px 2px;font:12.5px ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
button.file:hover{background:var(--accbg)}
.appr{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:13px}
.appr.done{opacity:.6;border-left-color:var(--line)}
.row{display:flex;gap:6px;margin-top:6px}
dialog{border:3px solid var(--wall);border-radius:10px;padding:0;width:min(900px,94vw);height:min(620px,88vh);background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(10,18,26,.55)}
.rv{display:flex;flex-direction:column;height:100%}
.rv-h{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:2px solid var(--wall)}
.rv-h h2{flex:1;margin:0;font-size:17px}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:9px 12px;border-bottom:3px solid transparent;color:var(--mut)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
.panel{flex:1;overflow:auto;padding:14px}
.card{border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:10px;font-size:13.5px}
.m{color:var(--mut);font-size:12px}
.tag{font-size:12px;padding:1px 7px;border-radius:4px;background:var(--runbg);color:var(--run);font-weight:600}
.bar{display:grid;grid-template-columns:140px 1fr;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.tr{height:10px;background:var(--line);border-radius:5px;margin:3px 0;overflow:hidden}.tr i{display:block;height:100%}
.k1{background:var(--mut)}.k2{background:var(--acc)}
pre{white-space:pre-wrap;word-break:break-word;font:12.5px ui-monospace,Menlo,Consolas,monospace;margin:0}
body.pg main,body.pg #theme{display:none}
#page{display:none;flex:1;min-height:0;padding:12px}
body.pg #page{display:block}
#page .rv{border:3px solid var(--wall);border-radius:10px;background:var(--paper);max-width:1000px;margin:0 auto}
@media(max-width:900px){main{grid-template-columns:1fr;overflow:auto}.col.l,.col.r{border:0;border-top:2px solid var(--wall)}.stream{min-height:300px}}
</style>
</head>
<body>
<header><h1>Discovery Lab</h1><span class="pill" id="pill">Connecting…</span><button class="btn" id="theme" aria-label="Toggle dark mode">Theme</button></header>
<div class="banner" id="nokey" hidden>No API key found. Stop the server, set ANTHROPIC_API_KEY in the same terminal, and start it again. You can still upload files.</div>
<main>
 <section class="col l" aria-label="Workspace files">
  <h2>Your data</h2>
  <div class="drop" id="drop">Drop files here<br><button class="btn" id="pick" type="button" style="margin-top:6px">Choose files</button><input type="file" id="fi" multiple hidden></div>
  <h2>Files in this lab</h2><div id="files"></div>
 </section>
 <section class="center" aria-label="Command center">
  <div class="rooms" id="rooms" role="group" aria-label="Rooms"></div>
  <div class="stream" id="stream" aria-live="polite"></div>
  <form class="cmd" id="cmd"><label for="q" hidden>Command</label><textarea id="q" placeholder="Ask the lab to investigate something…" rows="1"></textarea><button class="btn ok" id="go">Send</button></form>
 </section>
 <section class="col r" aria-label="Approvals"><h2>Needs your approval</h2><div id="appr"></div></section>
</main>
<div id="page"></div>
<dialog id="dlg" aria-label="Details"></dialog>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const R={orchestrator:["🧭","PI Office"],literature:["📚","Library"],data:["🗄️","Data Vault"],insight:["💡","Hypothesis Board"],planner:["📐","Planner"],runner:["🧪","Experiment Bench"],analyst:["📊","Analysis Room"],safety:["🛡️","Ethics Office"],notebook:["📓","Lab Notebook"],you:["🧑","You"]};
let ev=[],next=0,S=null,cur=null,tab=null,last={};
const H=(u,o={})=>fetch(u,{...o,headers:{"X-Lab":"1",...(o.headers||{})}});
const empty=(a,b)=>`<div class="empty"><b>${a}</b><br>${b||""}</div>`;
const nm=a=>(R[a]||["",a])[1];
function evHTML(e){const k=e.kind,t=`<time>${e.t}</time>`;
 if(k==="tool")return `<div class="ev tool">${esc(nm(e.agent))} ran: ${esc(e.text)}</div>`;
 if(k==="you"||k==="upload"||k==="decision")return `<div class="ev you">${esc(e.text)}</div>`;
 const lab=k==="handoff"?"hands off":k==="approval"?"asks you":"";
 return `<div class="ev ${k}"><span class="who">${esc(nm(e.agent))}</span> ${lab}${t}<br>${esc(e.text)}</div>`}
function hHTML(h){return `<div class="card"><div class="m">${esc(h.id)} · ${esc(nm(h.from))} to ${esc(nm(h.to))} · ${esc(h.type)} · confidence ${esc(h.confidence)} <span class="tag">agent-generated</span></div><div>${esc(h.claim)}</div>${h.evidence?.length?`<div class="m">Evidence: ${h.evidence.map(esc).join(", ")}</div>`:""}</div>`}
function tabsFor(id){if(id==="notebook")return["Timeline"];const t=["Activity","Handoffs"];if(id==="analyst")t.push("Results");if(["data","runner","analyst"].includes(id))t.push("Files");return t}
function body(id,t){if(!S)return"";
 if(t==="Activity"){const e=ev.filter(x=>x.agent===id);return e.length?e.map(evHTML).join(""):empty("No activity in this room yet.","Ask the lab something from the command bar.")}
 if(t==="Handoffs"||t==="Timeline"){const h=id==="notebook"?S.handoffs:S.handoffs.filter(x=>x.from===id||x.to===id);return h.length?h.slice().reverse().map(hHTML).join(""):empty("No handoffs yet.","Agents record every decision here.")}
 if(t==="Results"){const r=S.results;if(!r)return empty("No results yet.","Ask the lab to run the experiment on the generated pages.");
  const p=v=>v==null?"n/a":Math.round(v*100)+"%";
  return Object.entries(r.summary).map(([k,s])=>`<div class="bar"><span>${esc(k)}</span><div role="img" aria-label="${esc(k)}: axe-core ${p(s.axe_recall)}, agent ${p(s.agent_recall_mean)}"><div class="tr"><i class="k1" style="width:${(s.axe_recall||0)*100}%"></i></div><div class="tr"><i class="k2" style="width:${(s.agent_recall_mean||0)*100}%"></i></div></div></div>`).join("")+`<p class="m">Grey: axe-core recall. Teal: agent mean recall. Next target: <b>${esc(r.next_experiment_target)}</b></p>`}
 if(t==="Files"){const pre={data:"data/",runner:"runs/",analyst:"runs/"}[id];const f=S.files.filter(x=>x.startsWith(pre)&&!x.includes("("));return f.length?f.map(x=>`<button class="file" data-file="${esc(x)}">${esc(x)}</button>`).join(""):empty("No files here yet.")}
 return""}
function roomHTML(id,t,pg){t=tabsFor(id).includes(t)?t:tabsFor(id)[0];tab=t;
 return `<div class="rv"><div class="rv-h"><span aria-hidden="true">${R[id][0]}</span><h2>${nm(id)}</h2>${pg?'<button class="btn" data-act="back">Back to lab</button>':'<button class="btn" data-act="newtab">Open in new tab</button><button class="btn" data-act="close">Close</button>'}</div><div class="tabs" role="tablist">${tabsFor(id).map(n=>`<button class="tab" role="tab" aria-selected="${n===t}" data-tab="${n}">${n}</button>`).join("")}</div><div class="panel" role="tabpanel" tabindex="0">${body(id,t)}</div></div>`}
function set(el,html,key){if(last[key]!==html){last[key]=html;el.innerHTML=html;return true}return false}
function paint(){if(!S)return;
 $("#pill").textContent=S.busy?"Working":"Idle";$("#pill").className="pill"+(S.busy?" on":"");$("#nokey").hidden=S.key;$("#go").disabled=S.busy;
 const st=$("#stream"),near=st.scrollHeight-st.scrollTop-st.clientHeight<80;
 const sh=ev.length?ev.map(evHTML).join(""):`<div class="empty"><b>This is a blank lab.</b><br>Upload data on the left, or ask a question below. Rooms appear here as agents start working.<div class="ex"><button class="btn" data-ex="Run the accessibility audit experiment: generate test pages, compare axe-core with the LLM agent, and tell me which defect type to test next.">Run the accessibility audit</button><button class="btn" data-ex="Look at the files I uploaded and tell me what questions they could answer.">Explore my uploaded files</button></div></div>`;
 if(set(st,sh,"stream")&&near)st.scrollTop=st.scrollHeight;
 const seen=Object.keys(R).filter(a=>a!=="you"&&(a==="notebook"?S.handoffs.length:ev.some(e=>e.agent===a)||(S.status[a]||"idle")!=="idle"));
 set($("#rooms"),seen.length?seen.map(a=>`<button class="room" data-room="${a}"><span class="dot ${S.status[a]||""}"></span><span aria-hidden="true">${R[a][0]}</span>${R[a][1]}</button>`).join(""):'<span class="m">No rooms yet. They appear when agents start working.</span>',"rooms");
 set($("#files"),S.files.length?S.files.map(f=>f.includes("(")?`<div class="file">${esc(f)}</div>`:`<button class="file" data-file="${esc(f)}">${esc(f)}</button>`).join(""):'<p class="m">Nothing yet.</p>',"files");
 set($("#appr"),S.approvals.length?S.approvals.slice().reverse().map(a=>`<div class="appr ${a.state!=="pending"?"done":""}"><div>${esc(a.text)}</div><div class="m">${esc(nm(a.by))}${a.state!=="pending"?" · "+a.state:""}</div>${a.state==="pending"?`<div class="row"><button class="btn ok" data-ap="${a.id}" data-v="approved">Approve</button><button class="btn no" data-ap="${a.id}" data-v="rejected">Reject</button></div>`:""}</div>`).join(""):'<p class="m">Nothing waiting.</p>',"appr");
 if(document.body.classList.contains("pg")&&cur)set($("#page"),roomHTML(cur,tab,true),"page");
 else if($("#dlg").open&&cur&&!$("#dlg").dataset.f)set($("#dlg"),roomHTML(cur,tab,false),"dlg")}
async function poll(){try{const d=await (await H("/api/state?since="+next)).json();ev=ev.concat(d.events);next=d.next;S=d;paint()}catch(e){$("#pill").textContent="Server not reachable"}setTimeout(poll,1000)}
function openRoom(id,t){cur=id;const d=$("#dlg");d.dataset.f="";last.dlg=null;set(d,roomHTML(id,t,false),"dlg");if(!d.open)d.showModal()}
async function openFile(p){const d=$("#dlg");const t=await (await H("/api/file?path="+encodeURIComponent(p))).text();d.dataset.f="1";d.innerHTML=`<div class="rv"><div class="rv-h"><h2>${esc(p)}</h2><button class="btn" data-act="close">Close</button></div><div class="panel"><pre>${esc(t)}</pre></div></div>`;if(!d.open)d.showModal()}
async function send(text){if(!text.trim())return;const r=await H("/api/command",{method:"POST",body:JSON.stringify({text})});if(!r.ok){alert((await r.json()).error)}else $("#q").value=""}
async function up(files){for(const f of files){await H("/api/upload?name="+encodeURIComponent(f.name),{method:"POST",body:f})}}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
 if(d.room)return openRoom(d.room);if(d.file)return openFile(d.file);if(d.ex){$("#q").value=d.ex;return $("#q").focus()}
 if(d.ap)return H("/api/approve",{method:"POST",body:JSON.stringify({id:+d.ap,state:d.v})});
 if(d.tab){if($("#dlg").open)set($("#dlg"),roomHTML(cur,d.tab,false),"dlg");else set($("#page"),roomHTML(cur,d.tab,true),"page");return}
 if(d.act==="close")return $("#dlg").close();if(d.act==="back"){location.hash="";return}
 if(d.act==="newtab")return window.open(location.pathname+"#room/"+cur,"_blank","noopener");
 if(t.id==="pick")return $("#fi").click();
 if(t.id==="theme"){const r=document.documentElement;const dk=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dk?"light":"dark"}});
$("#cmd").addEventListener("submit",e=>{e.preventDefault();send($("#q").value)});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send($("#q").value)}});
$("#fi").addEventListener("change",e=>up(e.target.files));
const dz=$("#drop");["dragover","dragenter"].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.add("over")}));["dragleave","drop"].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.remove("over")}));
dz.addEventListener("drop",e=>up(e.dataTransfer.files));
$("#dlg").addEventListener("click",e=>{if(e.target.id==="dlg")e.target.close()});
document.addEventListener("keydown",e=>{const t=e.target;if(t.getAttribute&&t.getAttribute("role")==="tab"&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){const a=[...t.parentElement.children],i=(a.indexOf(t)+(e.key==="ArrowRight"?1:-1)+a.length)%a.length;a[i].click()}});
function route(){const m=location.hash.match(/^#room\/(\w+)/);if(m&&R[m[1]]){cur=m[1];document.body.classList.add("pg");last.page=null;set($("#page"),roomHTML(cur,tab,true),"page")}else document.body.classList.remove("pg")}
addEventListener("hashchange",route);route();poll();
</script>
</body>
</html>

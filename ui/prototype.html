<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A11y Discovery Lab</title>
<style>
:root{--bg:#eef1f4;--paper:#fbfcfd;--ink:#14212e;--mut:#556575;--line:#c5cdd6;--wall:#2b3a4a;--acc:#0a6e6e;--accbg:#d8efee;--warn:#9a5200;--warnbg:#fde9cf;--run:#5a3fc0;--runbg:#e6e0fa;--ok:#17703f;--okbg:#d6f0e0;--bad:#a3262a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e151c;--paper:#16212b;--ink:#e6edf3;--mut:#9aabbb;--line:#2f3f4e;--wall:#6f8599;--acc:#4fd1c5;--accbg:#12373a;--warn:#f0b35e;--warnbg:#3d2c12;--run:#b5a3ff;--runbg:#2a2350;--ok:#6fd49a;--okbg:#14341f;--bad:#ff8a8d}}
:root[data-theme="dark"]{--bg:#0e151c;--paper:#16212b;--ink:#e6edf3;--mut:#9aabbb;--line:#2f3f4e;--wall:#6f8599;--acc:#4fd1c5;--accbg:#12373a;--warn:#f0b35e;--warnbg:#3d2c12;--run:#b5a3ff;--runbg:#2a2350;--ok:#6fd49a;--okbg:#14341f;--bad:#ff8a8d}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25}
#app{display:flex;flex-direction:column;height:100%}
header.top{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:2px solid var(--wall);background:var(--paper)}
header.top h1{font-size:18px;letter-spacing:.2px}
.obj{font-size:13px;color:var(--mut);max-width:60ch}
.hbtn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 10px;font-size:13px}
.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 330px}
.floor{padding:18px;min-height:0;overflow:auto}
.plan{height:100%;min-height:440px;display:grid;gap:0;grid-template-columns:repeat(4,1fr);grid-template-rows:1.1fr 1.2fr 1fr;grid-template-areas:"pi pi lib lib" "hyp bench bench data" "ana ana eth nb";border:4px solid var(--wall);background:
 linear-gradient(var(--line) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/24px 24px,var(--paper)}
.room{position:relative;text-align:left;border:0;border-right:3px solid var(--wall);border-bottom:3px solid var(--wall);background:transparent;padding:14px;display:flex;flex-direction:column;gap:6px;transition:background .15s}
.room:hover{background:var(--accbg)}
.room .ic{font-size:26px;line-height:1}
.room h2{font-size:16px}
.room .ag{font-size:12.5px;color:var(--mut)}
.room .peek{font-size:13px;margin-top:auto}
.badge{align-self:flex-start;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.b-idle{color:var(--mut)}.b-run{color:var(--run);background:var(--runbg)}.b-appr{color:var(--warn);background:var(--warnbg)}.b-done{color:var(--ok);background:var(--okbg)}
aside.side{border-left:2px solid var(--wall);background:var(--paper);display:flex;flex-direction:column;min-height:0}
aside section{padding:14px 16px;border-bottom:1px solid var(--line);min-height:0}
aside h3{font-size:14px;margin-bottom:8px}
#queue{flex:0 0 auto;max-height:46%;overflow:auto}
#feed{flex:1;overflow:auto;border-bottom:0}
.appr{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:13px}
.appr .who{color:var(--mut);font-size:12px}
.row{display:flex;gap:6px;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 10px;font-size:13px}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.no{border-color:var(--bad);color:var(--bad)}
[data-theme="dark"] .btn.ok{color:#04210f}
.feed-i{font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.feed-i time{color:var(--mut);font-size:12px;margin-right:6px}
dialog{border:3px solid var(--wall);border-radius:10px;padding:0;width:min(920px,94vw);height:min(640px,88vh);background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(10,18,26,.55)}
.rv{display:flex;flex-direction:column;height:100%}
.rv-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:2px solid var(--wall)}
.rv-h h2{font-size:18px;flex:1}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;color:var(--mut);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
.panel{flex:1;overflow:auto;padding:16px}
.panel p{margin:0 0 10px;max-width:70ch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--mut)}
.tag{font-size:12px;padding:1px 7px;border-radius:4px;background:var(--accbg);color:var(--acc);font-weight:600}
.tag.agent{background:var(--runbg);color:var(--run)}
.note{background:var(--warnbg);color:var(--ink);border-left:4px solid var(--warn);padding:8px 10px;border-radius:4px;font-size:13px;margin-bottom:12px}
.bar{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bar .tr{height:10px;background:var(--line);border-radius:5px;margin:3px 0;overflow:hidden}
.bar .tr i{display:block;height:100%}
.k1{background:var(--mut)}.k2{background:var(--acc)}
.legend{font-size:12.5px;color:var(--mut);margin:8px 0}
.tree{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;white-space:pre;overflow:auto}
.pagehead{display:flex;gap:10px;align-items:center;padding:10px 16px}
.page{max-width:1000px;margin:0 auto;border:3px solid var(--wall);border-radius:10px;background:var(--paper);height:calc(100% - 24px);margin-top:12px}
@media(max-width:900px){body{height:auto}html{height:auto}#app{height:auto}.main{grid-template-columns:1fr}.plan{grid-template-columns:1fr 1fr;grid-template-rows:none;grid-template-areas:"pi pi" "lib hyp" "bench bench" "data ana" "eth nb";min-height:0}.room{min-height:130px}aside.side{border-left:0;border-top:2px solid var(--wall)}#queue{max-height:none}dialog{height:92vh}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg" aria-label="Room details"></dialog>
<script>
const AREA={pi:"pi",lib:"lib",data:"data",hyp:"hyp",bench:"bench",ana:"ana",eth:"eth",nb:"nb"};
const T=(h,rows)=>`<table><thead><tr>${h.map(x=>`<th scope="col">${x}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
const PH='<div class="note">Placeholder data for layout review. Real values arrive when Omnigent agents are wired in.</div>';
const bars=[["Missing form label",92,88],["Wrong ARIA role",31,79],["Focus order break",12,64],["Low contrast",95,40],["Misleading alt text",8,71]];
let approvals=[
 {id:1,by:"Experiment Bench",text:"Run headless browser on 40 generated test pages (sandboxed, no network)",s:"pending"},
 {id:2,by:"Analysis Room",text:"Send synthetic page HTML to an external LLM API (no user data included)",s:"pending"},
 {id:3,by:"Hypothesis Board",text:"Promote H3 (agent misses focus-order breaks) to the next experiment",s:"pending"}];
let feed=[["09:02","PI Office","Objective set: compare LLM agent vs axe-core on injected screen-reader defects"],["09:06","Library","Found 14 papers; 3 cite agent-based accessibility audits"],["09:11","Data Vault","Generated 40 pages with 120 labelled defects (v1)"],["09:15","Hypothesis Board","H1–H3 proposed (agent-generated, unverified)"],["09:18","Experiment Bench","Plan A chosen over Plan B: higher expected learning per cost"]];
const pend=()=>approvals.filter(a=>a.s==="pending").length;
const ROOMS=[
 {id:"pi",icon:"🧭",name:"PI Office",agent:"Orchestrator",peek:()=>"3 tasks open",st:()=>["idle","Idle"],tabs:{
  Objective:()=>PH+`<p><b>Question:</b> Do LLM agents detect screen-reader barriers that axe-core misses, and which barrier type should we test next?</p><p><b>Success measure:</b> recall and precision per defect type, agent vs axe-core, on pages with known injected defects.</p>`,
  "Task board":()=>PH+T(["Task","Owner","Status"],[["Pull accessibility audit literature","Library","Done"],["Generate pages with injected defects","Data Vault","Done"],["Run axe-core and agent on all pages","Experiment Bench","Running"],["Interpret per-type recall","Analysis Room","Waiting"]]),
  "Decision log":()=>PH+T(["Time","Decision","By"],[["09:18","Run Plan A (full crawl) first","Planner"],["09:31","Reopen H2 after unexpected result","Analyst"]])}},
 {id:"lib",icon:"📚",name:"Library",agent:"Literature agent",peek:()=>"14 papers · 3 relevant",st:()=>["done","Done"],tabs:{
  Papers:()=>PH+T(["Title","Year","Relevance"],[["Automated accessibility testing: coverage of WCAG rules","2021","High"],["LLM agents for UI audit","2024","High"],["Screen-reader navigation strategies","2019","Medium"]]),
  "Evidence for / against":()=>PH+`<p><span class="tag">For</span> Linters cannot judge whether a label is meaningful.</p><p><span class="tag">Against</span> Agent reports can be inconsistent between runs.</p>`,
  Notes:()=>PH+`<p>Add your own notes here. Each note will link back to a paper and a decision.</p>`}},
 {id:"data",icon:"🗄️",name:"Data Vault",agent:"Data agent",peek:()=>"v1 · 40 pages · 120 defects",st:()=>["done","Done"],tabs:{
  Files:()=>PH+`<div class="tree">data/
├─ pages_v1/        40 html files
├─ defects_v1.json  120 labelled defects
├─ runs/            axe + agent outputs
└─ provenance.md    how pages were built</div>`,
  Schema:()=>PH+T(["Field","Type","Meaning"],[["page_id","string","Test page"],["defect_type","enum","Missing label, wrong role, focus break…"],["selector","string","Where the defect was injected"]]),
  Provenance:()=>PH+`<p>Pages are synthetic. Defects are injected by script, so ground truth is known. Limit: synthetic pages are simpler than real sites.</p>`}},
 {id:"hyp",icon:"💡",name:"Hypothesis Board",agent:"Insight agent",peek:()=>"3 hypotheses",st:()=>["run","Reviewing"],tabs:{
  Hypotheses:()=>PH+T(["ID","Statement","Status"],[["H1",'Agent beats axe-core on wrong ARIA roles <span class="tag agent">agent-generated</span>',"Testing"],["H2",'axe-core beats agent on contrast <span class="tag agent">agent-generated</span>',"Supported"],["H3",'Agent misses focus-order breaks <span class="tag agent">agent-generated</span>',"Awaiting approval"]]),
  History:()=>PH+`<p>H2 was reopened after the first run and then supported by a second test.</p>`}},
 {id:"bench",icon:"🧪",name:"Experiment Bench",agent:"Planner + Runner",peek:()=>"Plan A running",st:()=>["run","Running"],tabs:{
  Options:()=>PH+T(["Plan","Expected learning","Cost","Chosen"],[["A: full crawl, all defect types","High","Medium","Yes"],["B: single defect type, 5 repeats","Medium","Low","No"]]),
  "Run records":()=>PH+T(["Run","Tool","Pages","Result"],[["r-001","axe-core","40","done"],["r-002","LLM agent","40","running"]]),
  Logs:()=>PH+`<div class="tree">09:20 start r-002
09:24 page 17/40 ok
09:25 page 18/40 retry (timeout)</div>`}},
 {id:"ana",icon:"📊",name:"Analysis Room",agent:"Analyst",peek:()=>"Agent wins 3 of 5 types",st:()=>["idle","Waiting"],tabs:{
  "Baseline vs agent":()=>PH+`<p>Recall by defect type (%)</p>`+bars.map(b=>`<div class="bar"><span>${b[0]}</span><div role="img" aria-label="${b[0]}: axe-core ${b[1]} percent, agent ${b[2]} percent"><div class="tr"><i class="k1" style="width:${b[1]}%"></i></div><div class="tr"><i class="k2" style="width:${b[2]}%"></i></div></div></div>`).join("")+`<div class="legend">Grey: axe-core · Teal: LLM agent</div>`,
  Uncertainty:()=>PH+`<p>Agent runs vary between repeats. Report ranges across 5 repeats before trusting any difference.</p>`,
  "Next decision":()=>PH+`<p>Weakest class for the agent is <b>focus order</b>. Next experiment: test that class with more repeats.</p>`}},
 {id:"eth",icon:"🛡️",name:"Ethics Office",agent:"Safety agent",peek:()=>pend()+" awaiting you",st:()=>pend()?["appr",pend()+" to approve"]:["done","All clear"],tabs:{
  Approvals:()=>`<div id="ethlist">${approvalList()}</div>`,
  Policies:()=>PH+T(["Policy","Enforced by"],[["No network from experiment sandbox","Tool permission"],["No real user data","Data Vault rules"],["Consequential steps need a human","Approval queue"]]),
  "Validation needed":()=>PH+`<p>Before real-world use: test on real sites, with screen-reader users, and across several model versions.</p>`}},
 {id:"nb",icon:"📓",name:"Lab Notebook",agent:"Shared record",peek:()=>feed.length+" entries",st:()=>["idle","Live"],tabs:{
  Timeline:()=>feed.map(f=>`<div class="feed-i"><time>${f[0]}</time><b>${f[1]}</b>: ${f[2]}</div>`).join(""),
  Export:()=>PH+`<p>Export the full record as Markdown or JSON so every decision can be reconstructed.</p><button class="btn">Export record</button>`}}
];
function approvalList(){return approvals.map(a=>`<div class="appr" ${a.s!=="pending"?'style="border-left-color:var(--line);opacity:.8"':""}><div>${a.text}</div><div class="who">Requested by ${a.by}${a.s!=="pending"?" · "+a.s:""}</div>${a.s==="pending"?`<div class="row"><button class="btn ok" data-a="${a.id}" data-v="approved">Approve</button><button class="btn no" data-a="${a.id}" data-v="rejected">Reject</button></div>`:""}</div>`).join("")}
const $=s=>document.querySelector(s);
const app=$("#app"),dlg=$("#dlg");
let cur=null,curTab=null;
function home(){
 app.innerHTML=`<header class="top"><div><h1>Accessibility Discovery Lab</h1><div class="obj">Objective: find which screen-reader barriers an LLM agent catches that axe-core misses.</div></div><button class="hbtn" id="theme" aria-label="Toggle dark mode">Theme</button></header>
 <div class="main"><div class="floor"><div class="plan" role="group" aria-label="Lab floor plan">${ROOMS.map(r=>{const[s,l]=r.st();return `<button class="room" style="grid-area:${AREA[r.id]}" data-room="${r.id}" aria-label="${r.name}, ${r.agent}, ${l}. Open room"><span class="ic" aria-hidden="true">${r.icon}</span><h2>${r.name}</h2><span class="ag">${r.agent}</span><span class="badge b-${s}">${l}</span><span class="peek">${r.peek()}</span></button>`}).join("")}</div></div>
 <aside class="side"><section id="queue" aria-live="polite"><h3>Needs your approval (${pend()})</h3>${pend()?approvals.filter(a=>a.s==="pending").map(a=>approvalList.call(null)&&`<div class="appr"><div>${a.text}</div><div class="who">${a.by}</div><div class="row"><button class="btn ok" data-a="${a.id}" data-v="approved">Approve</button><button class="btn no" data-a="${a.id}" data-v="rejected">Reject</button></div></div>`).join(""):"<p class='obj'>Nothing waiting.</p>"}</section><section id="feed"><h3>Live activity</h3>${feed.slice().reverse().map(f=>`<div class="feed-i"><time>${f[0]}</time><b>${f[1]}</b>: ${f[2]}</div>`).join("")}</section></aside></div>`;
}
function roomHTML(r,tab,isPage){
 const names=Object.keys(r.tabs);tab=tab||names[0];curTab=tab;
 return `<div class="rv"><div class="rv-h"><span aria-hidden="true" style="font-size:24px">${r.icon}</span><h2 id="rt">${r.name} <span class="ag" style="font-weight:400;font-size:13px;color:var(--mut)">· ${r.agent}</span></h2>${isPage?'<button class="btn" data-act="back">Back to floor plan</button>':'<button class="btn" data-act="newtab">Open in new tab</button><button class="btn" data-act="close">Close</button>'}</div>
 <div class="tabs" role="tablist" aria-label="${r.name} sections">${names.map(n=>`<button class="tab" role="tab" aria-selected="${n===tab}" tabindex="${n===tab?0:-1}" data-tab="${n}">${n}</button>`).join("")}</div>
 <div class="panel" role="tabpanel" tabindex="0">${r.tabs[tab]()}</div></div>`;
}
function openRoom(id,tab){cur=id;const r=ROOMS.find(x=>x.id===id);dlg.innerHTML=roomHTML(r,tab,false);dlg.setAttribute("aria-labelledby","rt");if(!dlg.open)dlg.showModal()}
function route(){const m=location.hash.match(/^#room\/(\w+)/);if(m&&ROOMS.find(r=>r.id===m[1])){cur=m[1];document.title=ROOMS.find(r=>r.id===cur).name+" · Discovery Lab";app.innerHTML=`<div class="page">${roomHTML(ROOMS.find(r=>r.id===cur),null,true)}</div>`;app.dataset.page="1"}else{delete app.dataset.page;document.title="A11y Discovery Lab";home()}}
function refresh(){if(app.dataset.page){const r=ROOMS.find(x=>x.id===cur);app.innerHTML=`<div class="page">${roomHTML(r,curTab,true)}</div>`}else{home();if(dlg.open){const r=ROOMS.find(x=>x.id===cur);dlg.innerHTML=roomHTML(r,curTab,false)}}}
function decide(id,v){const a=approvals.find(x=>x.id==id);a.s=v;feed.push([new Date().toTimeString().slice(0,5),"PI (you)",v+": "+a.text]);refresh()}
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 if(t.dataset.room)return openRoom(t.dataset.room);
 if(t.dataset.a)return decide(t.dataset.a,t.dataset.v);
 if(t.dataset.tab){const r=ROOMS.find(x=>x.id===cur);const box=app.dataset.page?app.querySelector(".page"):dlg;box.innerHTML=roomHTML(r,t.dataset.tab,!!app.dataset.page);box.querySelector('[aria-selected="true"]').focus();return}
 if(t.dataset.act==="close")return dlg.close();
 if(t.dataset.act==="newtab")return window.open(location.href.split("#")[0]+"#room/"+cur,"_blank","noopener");
 if(t.dataset.act==="back"){location.hash="";return}
 if(t.id==="theme"){const d=document.documentElement;const dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;d.dataset.theme=dark?"light":"dark"}
});
document.addEventListener("keydown",e=>{
 const t=e.target;if(t.getAttribute&&t.getAttribute("role")==="tab"&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){const tabs=[...t.parentElement.children];const i=tabs.indexOf(t)+(e.key==="ArrowRight"?1:-1);tabs[(i+tabs.length)%tabs.length].click()}});
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
addEventListener("hashchange",route);
route();
</script>
</body>
</html>
